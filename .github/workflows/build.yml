name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  # -------------------------------------------------------------------------
  # Windows x64 (MSVC / Visual Studio 2022)
  # -------------------------------------------------------------------------
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reaper_transitions-windows-x64
          path: build/Release/reaper_transitions.dll

  # -------------------------------------------------------------------------
  # macOS universal binary (arm64 + x86_64, deployment target 10.15)
  # -------------------------------------------------------------------------
  build-macos:
    name: macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal binary)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Build
        run: cmake --build build --parallel

      - name: Verify universal binary
        run: lipo -info build/reaper_transitions.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reaper_transitions-macos-universal
          path: build/reaper_transitions.dylib

  # -------------------------------------------------------------------------
  # Release: attach both binaries when a version tag (v*) is pushed
  # -------------------------------------------------------------------------
  release:
    name: Attach to Release
    needs: [ build-windows, build-macos ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: reaper_transitions-windows-x64
          path: dist/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: reaper_transitions-macos-universal
          path: dist/macos

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows/reaper_transitions.dll
            dist/macos/reaper_transitions.dylib
          generate_release_notes: true
